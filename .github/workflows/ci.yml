name: AutoSwarm v2

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install built wheel
        run: python -m pip install --no-index --find-links dist autoswarm
      - name: Check package entry points
        run: |
          autoswarm --version
          autoswarm --help
          python -m autoswarm --version
      - name: Test calls, recovery, cancellation and host returns
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the OpenCode return plugin
        run: node --test tests/test_opencode_plugin.mjs
      - name: Install a relocatable skill
        run: autoswarm setup --host codex --skill-dir "${{ runner.temp }}/autoswarm-skill"
      - name: Check the installed distribution outside the checkout
        run: python scripts/check_distribution.py -- autoswarm

  standalone:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: python scripts/build_release.py
      - name: Check standalone distribution
        run: python scripts/check_distribution.py -- dist/standalone/autoswarm
      - uses: actions/upload-artifact@v4
        with:
          name: autoswarm-${{ matrix.os }}
          path: dist/standalone/*
